# ===== catppuccin frappe theme for rmux (plugin-free) ===== #
# rmux reads tmux-style status/style options, but it does not need TPM for this.
set -g status on
set -g status-style "bg=#292c3c,fg=#c6d0f5"
set -g status-left-length 100
set -g status-right-length 300
set -g status-left ""
set -g status-right "#[fg=#414559,bg=#292c3c]#[bg=#414559,fg=#ea999c,bold] #[fg=#c6d0f5]#{pane_current_command} #[fg=#a6d189,bold] #[fg=#c6d0f5]#S #[fg=#85c1dc,bold]󰥔 %H:%M #[fg=#414559,bg=#292c3c]"
set -g status-format[1] ""

set -g message-style "bg=#737994,fg=#232634,align=centre"
set -g message-command-style "bg=#737994,fg=#232634,align=centre"
set -g mode-style "bg=#414559,fg=#c6d0f5,bold"
set -wg copy-mode-match-style "bg=#51576d,fg=#c6d0f5"
set -wg copy-mode-current-match-style "bg=#ca9ee6,fg=#232634,bold"
set -wg copy-mode-mark-style "bg=#e5c890,fg=#232634,bold"
set -wg menu-style "bg=#303446,fg=#c6d0f5"
set -wg menu-selected-style "bg=#737994,fg=#232634,bold"
set -wg menu-border-style "fg=#babbf1"
set -wg popup-style "bg=#303446,fg=#c6d0f5"
set -wg popup-border-style "fg=#babbf1"
set -wg clock-mode-colour "#babbf1"

set -wg pane-border-style "fg=#737994"
set -wg pane-active-border-style "fg=#babbf1"
set -wg window-status-separator " "
set -wg window-status-style "bg=#292c3c,fg=#c6d0f5"
set -wg window-status-format "#[fg=#949cbb,bg=#292c3c]#[fg=#232634,bg=#949cbb]#I#[fg=#c6d0f5,bg=#414559] #W #[fg=#414559,bg=#292c3c]"
set -wg window-status-current-style "bg=#292c3c,fg=#c6d0f5"
set -wg window-status-current-format "#[fg=#ca9ee6,bg=#292c3c]#[fg=#232634,bg=#ca9ee6,bold]#I #[fg=#c6d0f5,bg=#51576d,bold] #W #[fg=#51576d,bg=#292c3c]"
set -wg window-status-activity-style "bg=#babbf1,fg=#232634"
set -wg window-status-bell-style "bg=#e5c890,fg=#232634"
